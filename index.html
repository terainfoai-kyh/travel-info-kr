    <!-- Global Script Chunk Load Error Auto-Reload Handler (Fixes stale CDN cache 500/404 errors) -->
    <script>
      window.addEventListener('error', function(e) {

          if (src.includes('/assets/')) {
            var hasReloaded = sessionStorage.getItem('__chunk_reload_done');
            if (!hasReloaded) {
              sessionStorage.setItem('__chunk_reload_done', '1');
              window.location.reload(true);
            }
          }
        }
      }, true);
    </script>
